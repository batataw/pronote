[project]
name = "pronote-extractor"
version = "0.2.0"
description = "Extraction déterministe d'emploi du temps PRONOTE (PDF ou capture d'écran) vers JSON"
requires-python = "==3.12.*"
dependencies = [
    "fastapi==0.162.0",
    "httpx==0.28.1",
    "pdfplumber==0.11.10",
    "pytest==9.2.0",
    "python-multipart==0.0.32",
    "uvicorn==0.54.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pronote_extractor"]

[tool.pytest.ini_options]
testpaths = ["tests"]
